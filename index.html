<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cara Engineering</title>
<meta name="theme-color" content="#0D2638">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cara">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0D141A; }
  body { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0D141A; transition: opacity .4s; }
  .splash img { width: 96px; height: 96px; border-radius: 22px; }
  .splash.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="splash" id="splash"><img src="icon-192.png" alt="Cara"></div>
<iframe id="app" title="Cara Engineering" allow="camera; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbxYSChH6TyZ--LWcHzxtt811cfel9yj6eTpL8RiUiAUH_zcXW-Z5OOz-y5sX6BKW3q0aQ/exec"></iframe>
<script>
  document.getElementById("app").addEventListener("load", function () {
    document.getElementById("splash").classList.add("gone");
  });
  setTimeout(function () { document.getElementById("splash").classList.add("gone"); }, 6000);
</script>
</body>
</html>
